<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>周末生活节</title><style>
*{box-sizing:border-box}body{margin:0;font:15px system-ui;background:#f5efe3;color:#282c25}header{padding:24px 20px;background:linear-gradient(130deg,#f6cb61,#ffebae)}h1{margin:4px 0;font-size:32px}.tag{font-size:12px;background:#183f33;color:white;padding:5px 9px;border-radius:20px}main{padding:14px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.tile,.coupon{padding:12px;background:white;border-radius:16px;margin:10px 0}img{width:100%;border-radius:10px}.coupon{display:flex;align-items:center;justify-content:space-between;gap:10px}.price{font-size:28px;color:#b33e29}button{padding:12px;border:0;border-radius:24px;background:#194f3d;color:white}button:disabled{opacity:.5}.bar{position:sticky;top:0;background:#fffdf5;padding:12px;z-index:2;display:flex;justify-content:space-between}.sticky{position:sticky;bottom:0;padding:12px;background:#fffdf5;border-top:1px solid #ccc}dialog{border:0;border-radius:20px;max-width:88%}dialog::backdrop{background:#0007}label{display:flex;align-items:center;gap:8px;margin:16px 0}input{width:22px;height:22px}.muted{color:#667568;font-size:12px}#status{min-height:24px;color:#126046}
</style><header><span class="tag">城市生活 · 活动会场</span><h1>周末生活节</h1><p>好物到家，多重优惠一起用</p></header>
<nav class="bar"><a href="#coupons">领取优惠</a><a href="#picks">精选好物</a><a href="#rules">活动规则</a></nav>
<main><section id="coupons"><h2>本周专属券包</h2><div id="cards">正在加载优惠券…</div><p id="status" role="status"></p></section>
<section id="picks"><h2>逛逛品质生活</h2><div class="grid" id="products"></div></section>
<details id="rules"><summary>优惠叠加与退款规则</summary><p>同意活动规则只代表领取优惠券；订单金额仍由结算页核算。店铺券与平台券可叠加，退款按实际支付金额退回。</p><p>同意、领取、确认等文字会同时出现在说明、按钮和弹窗中。</p></details></main>
<footer class="sticky"><button id="done">返回商城</button><span class="muted">优惠券保存在当前账号</span></footer>
<dialog id="agreement"><h2>领取确认</h2><p>请阅读并同意活动规则。说明中的“同意”不会自动勾选。</p><label><input id="consent" type="checkbox" aria-label="同意活动规则">同意活动规则</label><button id="cancel">暂不领取</button> <button id="confirm">确认领取</button></dialog>
<script>
const params=new URLSearchParams(location.search),run=params.get('run'),session=params.get('session');
let selected='',claimed=[];const byId=id=>document.getElementById(id);
async function api(body){const r=await fetch('/api/shop/coupons?run='+encodeURIComponent(run),{method:body?'POST':'GET',headers:{'Content-Type':'application/json','Authorization':'Bearer '+session,'x-lab-source':'h5-campaign'},body:body?JSON.stringify(body):undefined});const data=await r.json();if(!r.ok)throw Error(data.error);return data;}
async function load(){try{const data=await api();claimed=data.claimed;byId('cards').replaceChildren();for(const coupon of data.coupons){const card=document.createElement('article');card.className='coupon';const label=document.createElement('div');label.innerHTML='<strong class="price">¥'+coupon.amount/100+'</strong><div>'+coupon.title+'</div><small>同账号可与其他优惠叠加</small>';const button=document.createElement('button');button.textContent=claimed.includes(coupon.code)?'已领取 '+coupon.code:'领取 '+coupon.code;button.disabled=claimed.includes(coupon.code);button.onclick=()=>{selected=coupon.code;byId('consent').checked=false;byId('agreement').showModal();};card.append(label,button);byId('cards').append(card);}}catch(error){byId('status').textContent='加载失败：'+error.message;}}
byId('cancel').onclick=()=>byId('agreement').close();
byId('confirm').onclick=async()=>{if(!byId('consent').checked){byId('status').textContent='请先勾选活动规则';return;}byId('confirm').disabled=true;try{await api({code:selected,agreement:true});byId('agreement').close();byId('status').textContent='领取成功 '+selected;await load();}catch(error){byId('status').textContent='领取失败：'+error.message;}finally{byId('confirm').disabled=false;}};
byId('done').onclick=()=>window.CityLab.close();
for(let i=0;i<8;i++){const card=document.createElement('article');card.className='tile';card.innerHTML='<img loading="lazy" alt="精选好物 '+(i+1)+'" src="/images/product-'+i+'.png"><strong>'+['随行好物','周末出游','桌面焕新'][i%3]+'</strong><p class="muted">限时福利 · 30分钟达</p>';byId('products').append(card);}load();
</script></html>
